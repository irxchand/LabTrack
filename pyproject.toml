[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "labtrack"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.115.12", "uvicorn[standard]==0.34.3", "SQLAlchemy==2.0.41", "alembic==1.16.1", "PyMySQL==1.1.1", "pymongo==4.13.0", "APScheduler==3.11.0", "pydantic-settings==2.9.1", "httpx==0.28.1", "python-multipart==0.0.20", "Pillow==11.2.1", "boto3==1.38.34"]

[project.optional-dependencies]
test = ["pytest==8.3.5", "pytest-cov==6.1.1"]

[tool.setuptools.packages.find]
where = ["src/backend"]

[tool.pytest.ini_options]
pythonpath = ["src/backend"]
testpaths = ["tests"]
addopts = "-q"
markers = ["integration: requires running MySQL and MongoDB services"]
