<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="LabTrack — Python-Based Data-Driven Hardware Availability & Tracking System with Advanced MySQL & MongoDB Integration. DCDS Lab ESE Miniproject." />
    <title>LabTrack — DCDS Lab ESE Presentation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main id="app" aria-live="polite">
      <div id="stage"><div id="deck"></div></div>

      <div id="progress" aria-hidden="true"><div id="progress-bar"></div></div>

      <nav id="controls" aria-label="Slide navigation">
        <button id="btn-prev" class="ctrl" aria-label="Previous slide" title="Previous (←)">
          <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <span id="counter">1 / 24</span>
        <button id="btn-next" class="ctrl" aria-label="Next slide" title="Next (→ / Space)">
          <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
        </button>
        <span class="ctrl-sep"></span>
        <button id="btn-overview" class="ctrl" aria-label="Slide overview" title="Overview (O)">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
        </button>
        <button id="btn-fullscreen" class="ctrl" aria-label="Toggle fullscreen" title="Fullscreen (F)">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </nav>

      <section id="overview" aria-label="All slides" hidden>
        <header><h2>All slides</h2><button id="btn-close-overview" class="ctrl" aria-label="Close overview">✕</button></header>
        <div id="overview-grid"></div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
