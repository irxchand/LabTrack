components:
  schemas:
    AssetView:
      properties:
        barcode:
          type: string
          title: Barcode
        state:
          type: string
          title: State
        default_id:
          type: string
          title: Default Id
        bill_number:
          type: string
          title: Bill Number
      type: object
      required:
      - barcode
      - state
      - default_id
      - bill_number
      title: AssetView
    Body_upload_evidence_api_requests__identifier__evidence_post:
      properties:
        file:
          type: string
          format: binary
          title: File
      type: object
      required:
      - file
      title: Body_upload_evidence_api_requests__identifier__evidence_post
    DecisionInput:
      properties:
        decision:
          type: string
          enum:
          - APPROVE
          - REJECT
          title: Decision
        remarks:
          type: string
          maxLength: 4000
          title: Remarks
          default: ''
      additionalProperties: false
      type: object
      required:
      - decision
      title: DecisionInput
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        decision:
          anyOf:
          - type: string
          - type: 'null'
          title: Decision
      type: object
      required:
      - code
      - message
      title: ErrorDetail
    ErrorEnvelope:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      type: object
      required:
      - error
      title: ErrorEnvelope
    ExtensionInput:
      properties:
        new_due_at:
          type: string
          format: date-time
          title: New Due At
        reason:
          type: string
          maxLength: 2000
          minLength: 1
          title: Reason
      additionalProperties: false
      type: object
      required:
      - new_due_at
      - reason
      title: ExtensionInput
    ExtensionView:
      properties:
        id:
          type: integer
          title: Id
        state:
          type: string
          title: State
        old_due_at:
          type: string
          title: Old Due At
        new_due_at:
          type: string
          title: New Due At
        reason:
          type: string
          title: Reason
      type: object
      required:
      - id
      - state
      - old_due_at
      - new_due_at
      - reason
      title: ExtensionView
    IssueInput:
      properties:
        assignments:
          additionalProperties:
            items:
              type: string
            type: array
          type: object
          title: Assignments
        physical_handover_confirmed:
          type: boolean
          const: true
          title: Physical Handover Confirmed
      additionalProperties: false
      type: object
      required:
      - physical_handover_confirmed
      title: IssueInput
    ItemView:
      properties:
        id:
          type: integer
          title: Id
        name:
          type: string
          title: Name
        kind:
          type: string
          title: Kind
        category:
          type: string
          title: Category
        description:
          type: string
          title: Description
        brand:
          type: string
          title: Brand
        specs:
          additionalProperties: true
          type: object
          title: Specs
        labs:
          items:
            $ref: '#/components/schemas/LabStockView'
          type: array
          title: Labs
        available:
          type: integer
          title: Available
        image_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Image Url
        cost_tier:
          anyOf:
          - type: string
          - type: 'null'
          title: Cost Tier
      type: object
      required:
      - id
      - name
      - kind
      - category
      - description
      - brand
      - specs
      - labs
      - available
      title: ItemView
    LabStockView:
